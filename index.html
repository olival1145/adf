<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Fluxo Jurídico</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#162033;--muted:#667085;--line:#e4e7ec;--nav:#0f172a;--pri:#174d7d;--ok:#067647;--warn:#b54708;--bad:#b42318;--vio:#6941c6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hide{display:none!important}.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.sub{font-size:12px;color:#cbd5e1}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100dvh - 60px)}aside{background:#fff;border-right:1px solid var(--line);padding:14px;position:sticky;top:60px;height:calc(100dvh - 60px)}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:11px;font-weight:750;color:#475467;margin:3px 0}.nav.active{background:#eaf2fb;color:#123d69}.nav span{float:right;background:#eef2f6;border-radius:99px;padding:1px 7px;font-size:11px}main{padding:20px;max-width:1500px;width:100%;margin:auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:var(--pri);color:#fff;cursor:pointer}.btn.gray{background:#eef2f6;color:#344054}.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}.btn.vio{background:var(--vio)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 28px rgba(16,24,40,.06)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.stat b{font-size:26px;display:block;margin-top:5px}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin-bottom:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:800;color:#475467}.field input,.field select,.field textarea{border:1px solid #d0d5dd;border-radius:10px;padding:10px 11px;background:#fff}.field textarea{min-height:90px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{border-collapse:collapse;width:100%;min-width:900px}.table th{background:#f8fafc;text-align:left;padding:10px;font-size:11px;color:#667085;text-transform:uppercase}.table td{padding:10px;border-top:1px solid #eef1f4;font-size:13px;vertical-align:top}.pill{display:inline-flex;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:850}.p-pending{background:#fff7ed;color:#b54708}.p-correction{background:#f4f3ff;color:#6941c6}.p-resolved{background:#ecfdf3;color:#067647}.p-returned{background:#fef3f2;color:#b42318}.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}.modalbg.show{display:flex}.modal{background:#fff;width:min(980px,100%);max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.span2{grid-column:1/-1}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0f172a,#174d7d)}.loginbox{width:min(480px,100%);background:#fff;border-radius:22px;padding:24px}.loginbox h1{margin:0 0 4px}.loginbox .field{margin:10px 0}.notice{padding:11px;border-radius:10px;margin:10px 0;font-size:13px;background:#eff8ff;color:#1849a9}.error{background:#fef3f2;color:#b42318}.success{background:#ecfdf3;color:#067647}.mobile{display:none}.notif{border-bottom:1px solid #eef1f4;padding:11px 0}.notif.unread{font-weight:750}.drivebox{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}@media(max-width:900px){.layout{display:block}aside{display:none}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.span2{grid-column:auto}main{padding:14px 12px 86px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.mobile button{border:0;background:transparent;font-size:11px;font-weight:800;color:#475467;padding:8px}.mobile button.active{color:#174d7d}.top .sub{display:none}}
</style>
</head>
<body>
<div id="auth" class="login">
  <div class="loginbox">
    <h1>Fluxo Jurídico</h1><div class="muted">Gestão interna do escritório</div>
    <div id="authMsg"></div>
    <div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div>
    <div class="row"><button class="btn" onclick="signIn()">Entrar</button><button class="btn gray" onclick="signUp()">Criar conta</button></div>
    <p class="muted" style="font-size:12px">Cada integrante cria sua própria conta. Na primeira entrada, o sistema pede o código de vinculação da função.</p>
  </div>
</div>
<div id="claim" class="login hide">
  <div class="loginbox">
    <h1>Vincular função</h1><p class="muted">Selecione quem você é e informe o código temporário.</p>
    <div id="claimMsg"></div>
    <div class="field"><label>Integrante</label><select id="claimStaff"></select></div>
    <div class="field"><label>Código</label><input id="claimCode" autocomplete="one-time-code"></div>
    <button class="btn" style="width:100%" onclick="claimIdentity()">Vincular minha conta</button>
    <button class="btn gray" style="width:100%;margin-top:8px" onclick="logout()">Sair</button>
  </div>
</div>
<div id="app" class="hide">
  <header class="top"><div><div class="brand">Fluxo Jurídico</div><div class="sub" id="who"></div></div><div class="row"><button class="btn gray" onclick="requestNotifPermission()">Ativar avisos</button><button class="btn" onclick="openProcess()">+ Nova atribuição</button></div></header>
  <div class="layout"><aside id="sidebar"></aside><main id="main"></main></div>
  <nav class="mobile" id="mobile"></nav>
</div>
<div id="processModal" class="modalbg"><div class="modal"><div class="row between"><h2 id="modalTitle">Nova atribuição</h2><button class="btn gray" onclick="closeModal()">Fechar</button></div><div id="processForm"></div></div></div>
<script>
const SUPABASE_URL='https://npcphfhlepjizqkbjdco.supabase.co';
const SUPABASE_KEY='sb_publishable_0YP_R1RXY_WZKRLAqBJSmQ_LZVnwBE9';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const STAFF={OLIVAL:'11111111-1111-4111-8111-111111111111',ERICA:'22222222-2222-4222-8222-222222222222',KLEINE:'33333333-3333-4333-8333-333333333333'};
let me=null, users=[], processes=[], notifications=[], activities=[], view='my', editing=null, realtime=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function msg(id,text,type='notice'){ $(id).innerHTML=`<div class="notice ${type}">${esc(text)}</div>` }
async function signIn(){msg('authMsg','Entrando...');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('authMsg',error.message,'error');boot()}
async function signUp(){const email=$('email').value.trim(),password=$('password').value;if(password.length<6)return msg('authMsg','Use uma senha com pelo menos 6 caracteres.','error');const {data,error}=await sb.auth.signUp({email,password});if(error)return msg('authMsg',error.message,'error');msg('authMsg',data.session?'Conta criada.':'Conta criada. Se o Supabase pedir confirmação por e-mail, confirme e depois entre.','success');if(data.session)boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('auth').classList.remove('hide');$('claim').classList.add('hide');$('app').classList.add('hide');return}
 const {data:mine}=await sb.from('app_users').select('*').eq('auth_user_id',session.user.id).maybeSingle();
 if(!mine){const {data:list}=await sb.rpc('list_claimable_staff');$('claimStaff').innerHTML=(list||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('auth').classList.add('hide');$('claim').classList.remove('hide');$('app').classList.add('hide');return}
 me=mine;$('auth').classList.add('hide');$('claim').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=`${me.name} · ${me.role}`;await loadAll();setupRealtime();renderNav();render();}
async function claimIdentity(){const {data,error}=await sb.rpc('claim_staff_identity',{p_staff_id:$('claimStaff').value,p_invite_token:$('claimCode').value.trim().toUpperCase()});if(error||!data)return msg('claimMsg',error?.message||'Código inválido ou identidade já vinculada.','error');msg('claimMsg','Conta vinculada.','success');setTimeout(boot,400)}
async function loadAll(){await sb.rpc('generate_deadline_notifications');let r=await Promise.all([sb.from('app_users').select('*').order('name'),sb.from('processes').select('*').order('source_row',{ascending:false}),sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(200)]);users=r[0].data||[];processes=r[1].data||[];notifications=r[2].data||[]}
function setupRealtime(){if(realtime)sb.removeChannel(realtime);realtime=sb.channel('fluxo-live').on('postgres_changes',{event:'*',schema:'public',table:'processes'},async()=>{await loadAll();renderNav();render()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${me.id}`},p=>{notifications.unshift(p.new);renderNav();if(Notification.permission==='granted')new Notification(p.new.title,{body:p.new.body||''});if(view==='notifications')render()}).subscribe()}
function counts(){return{my:processes.filter(p=>p.active&&p.assignee_id===me.id).length,jud:processes.filter(p=>p.active&&p.status==='pending'&&p.phase==='Judicial').length,adm:processes.filter(p=>p.active&&p.status==='pending'&&p.phase==='Administrativo/INSS').length,corr:processes.filter(p=>p.active&&p.status==='correction').length,hist:processes.filter(p=>!p.active||p.status==='resolved').length,not:notifications.filter(n=>!n.read_at).length}}
function renderNav(){const c=counts(),items=[['my','Minha fila',c.my],['jud','Judicial pendente',c.jud],['adm','Administrativo/INSS',c.adm],['corr','Correções',c.corr],['history','Histórico',c.hist],['notifications','Notificações',c.not],['settings','Configurações','']];$('sidebar').innerHTML=items.map(i=>`<button class="nav ${view===i[0]?'active':''}" onclick="go('${i[0]}')">${i[1]}<span>${i[2]}</span></button>`).join('');$('mobile').innerHTML=items.slice(0,6).map(i=>`<button class="${view===i[0]?'active':''}" onclick="go('${i[0]}')">${i[1]} ${i[2]?`(${i[2]})`:''}</button>`).join('')}
function go(v){view=v;renderNav();render()}
function filtered(){if(view==='my')return processes.filter(p=>p.active&&p.assignee_id===me.id);if(view==='jud')return processes.filter(p=>p.active&&p.status==='pending'&&p.phase==='Judicial');if(view==='adm')return processes.filter(p=>p.active&&p.status==='pending'&&p.phase==='Administrativo/INSS');if(view==='corr')return processes.filter(p=>p.active&&p.status==='correction');if(view==='history')return processes.filter(p=>!p.active||p.status==='resolved');return []}
function render(){if(view==='notifications')return renderNotifications();if(view==='settings')return renderSettings();const list=filtered();const c=counts();$('main').innerHTML=`<div class="row between"><div><h2 style="margin:0">${title()}</h2><div class="muted">${list.length} registro(s)</div></div><button class="btn" onclick="openProcess()">+ Nova atribuição</button></div><div class="stats"><div class="card stat"><span>Minha fila</span><b>${c.my}</b></div><div class="card stat"><span>Judicial</span><b>${c.jud}</b></div><div class="card stat"><span>Administrativo</span><b>${c.adm}</b></div><div class="card stat"><span>Correções</span><b>${c.corr}</b></div><div class="card stat"><span>Não lidas</span><b>${c.not}</b></div></div><div class="card"><div class="filters"><input id="q" placeholder="Buscar cliente, tarefa ou observação" oninput="renderTable()"><select id="phaseF" onchange="renderTable()"><option value="">Todas as fases</option><option>Judicial</option><option>Administrativo/INSS</option></select><select id="statusF" onchange="renderTable()"><option value="">Todos os status</option><option value="pending">Pendente</option><option value="correction">Correção</option><option value="resolved">Concluído</option><option value="returned">Devolvido</option></select><select id="ownerF" onchange="renderTable()"><option value="">Todos responsáveis</option>${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div id="tbl"></div></div>`;renderTable()}
function title(){return({my:'Minha fila',jud:'Pendências judiciais',adm:'Administrativo / INSS',corr:'Fila de correção — Dra. Kleíne',history:'Histórico'})[view]||'Fluxo Jurídico'}
function renderTable(){let list=filtered(),q=($('q')?.value||'').toLowerCase(),ph=$('phaseF')?.value||'',st=$('statusF')?.value||'',ow=$('ownerF')?.value||'';list=list.filter(p=>(!q||[p.client_name,p.task_type,p.instruction,p.notes,p.missing_docs].join(' ').toLowerCase().includes(q))&&(!ph||p.phase===ph)&&(!st||p.status===st)&&(!ow||p.assignee_id===ow));$('tbl').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Cliente</th><th>Fase</th><th>Tarefa</th><th>Responsável</th><th>Status</th><th>Prazo</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.client_name)}</b><div class="muted" style="font-size:11px">${esc(p.case_number||'')}</div></td><td>${esc(p.phase)}</td><td>${esc(p.task_type||p.benefit||'')}</td><td>${esc(userName(p.assignee_id))}</td><td><span class="pill p-${p.status}">${statusLabel(p.status)}</span></td><td>${p.deadline_date?fmt(p.deadline_date):esc(p.deadline_raw||'—')}</td><td><button class="btn gray" onclick="openProcess('${p.id}')">Abrir</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nenhum registro.</td></tr>'}</tbody></table></div>`}
function userName(id){return users.find(u=>u.id===id)?.name||'—'}function statusLabel(s){return({pending:'Pendente',correction:'Correção',resolved:'Concluído',returned:'Devolvido'})[s]||s}function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}
function openProcess(id=''){editing=id?processes.find(p=>p.id===id):null;const p=editing||{};$('modalTitle').textContent=editing?'Atualizar processo':'Nova atribuição';$('processForm').innerHTML=`<div class="grid2"><div class="field"><label>Cliente *</label><input id="fClient" value="${esc(p.client_name||'')}"></div><div class="field"><label>Nº processo</label><input id="fCase" value="${esc(p.case_number||'')}"></div><div class="field"><label>Fase *</label><select id="fPhase"><option ${p.phase==='Judicial'?'selected':''}>Judicial</option><option ${p.phase==='Administrativo/INSS'?'selected':''}>Administrativo/INSS</option></select></div><div class="field"><label>Assunto/benefício</label><input id="fBenefit" value="${esc(p.benefit||'')}"></div><div class="field span2"><label>Tarefa *</label><input id="fTask" value="${esc(p.task_type||'')}"></div><div class="field span2"><label>O que aconteceu / contexto *</label><textarea id="fContext">${esc(p.context||'')}</textarea></div><div class="field span2"><label>Instrução objetiva — o que deve ser feito *</label><textarea id="fInstruction">${esc(p.instruction||'')}</textarea></div><div class="field"><label>Status</label><select id="fStatus" onchange="autoRoute()"><option value="pending" ${p.status==='pending'?'selected':''}>Pendente</option><option value="correction" ${p.status==='correction'?'selected':''}>Correção</option><option value="returned" ${p.status==='returned'?'selected':''}>Devolvido</option><option value="resolved" ${p.status==='resolved'?'selected':''}>Concluído</option></select></div><div class="field"><label>Responsável</label><select id="fOwner">${users.map(u=>`<option value="${u.id}" ${p.assignee_id===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Prazo final</label><input id="fDeadline" type="date" value="${p.deadline_date||''}"></div><div class="field"><label>Sem prazo?</label><select id="fNoDeadline"><option value="no">Não</option><option value="yes" ${!p.deadline_date&&p.deadline_raw==='Sem prazo'?'selected':''}>Sim</option></select></div><div class="field span2"><label>Pendência / documento faltante</label><textarea id="fMissing">${esc(p.missing_docs||'')}</textarea></div><div class="field span2"><label>Próxima providência</label><input id="fNext" value="${esc(p.next_action||'')}"></div><div class="field span2"><label>Observações</label><textarea id="fNotes">${esc(p.notes||'')}</textarea></div><div class="span2 drivebox"><b>Google Drive</b><div class="muted" style="font-size:12px">${p.drive_folder_name?esc(p.drive_folder_name):'Nenhuma pasta vinculada.'}</div><div class="row" style="margin-top:8px"><button class="btn gray" onclick="driveSearchAndLink()">Localizar pasta do cliente</button><button class="btn gray" onclick="driveCreateFolder()">Criar pasta</button>${p.drive_folder_url?`<a class="btn gray" href="${esc(p.drive_folder_url)}" target="_blank">Abrir pasta</a>`:''}</div></div><div id="formMsg" class="span2"></div><div class="span2 row"><button class="btn green" onclick="saveProcess()">Salvar</button>${editing&&editing.active?`<button class="btn red" onclick="returnResponsibility()">Devolver responsabilidade</button>`:''}</div></div>`;autoRoute();$('processModal').classList.add('show')}
function autoRoute(){if($('fStatus')?.value==='correction')$('fOwner').value=STAFF.KLEINE}
function closeModal(){$('processModal').classList.remove('show');editing=null}
async function saveProcess(){const client=$('fClient').value.trim(),task=$('fTask').value.trim(),context=$('fContext').value.trim(),instruction=$('fInstruction').value.trim(),phase=$('fPhase').value,status=$('fStatus').value,deadline=$('fDeadline').value,noDeadline=$('fNoDeadline').value==='yes';if(!client||!task||!context||instruction.length<8)return msg('formMsg','Preencha cliente, tarefa, contexto e uma instrução objetiva.','error');if(phase==='Judicial'&&!deadline&&!noDeadline)return msg('formMsg','No judicial, informe o prazo final ou marque “Sem prazo”.','error');let owner=$('fOwner').value;if(status==='correction')owner=STAFF.KLEINE;const obj={client_name:client,case_number:$('fCase').value.trim()||null,phase,benefit:$('fBenefit').value.trim()||null,task_type:task,context,instruction,status,assignee_id:owner,sender_id:editing?.sender_id||me.id,deadline_date:deadline||null,deadline_raw:noDeadline?'Sem prazo':(deadline||null),missing_docs:$('fMissing').value.trim()||null,next_action:$('fNext').value.trim()||null,notes:$('fNotes').value.trim()||null,active:status!=='resolved'};let error,record;if(editing){({data:record,error}=await sb.from('processes').update(obj).eq('id',editing.id).select().single())}else{({data:record,error}=await sb.from('processes').insert(obj).select().single())}if(error)return msg('formMsg',error.message,'error');await sb.from('activities').insert({process_id:record.id,actor_id:me.id,action:editing?'PROCESSO ATUALIZADO':'NOVA ATRIBUIÇÃO',details:{status:record.status,responsavel:userName(record.assignee_id)}});closeModal();await loadAll();renderNav();render()}
async function returnResponsibility(){if(!editing)return;const reason=prompt('Motivo da devolução:');if(!reason||reason.trim().length<5)return;const to=editing.sender_id||STAFF.KLEINE;const {error}=await sb.from('processes').update({assignee_id:to,status:'returned',active:true,missing_docs:[editing.missing_docs,`DEVOLUÇÃO: ${reason}`].filter(Boolean).join(' | ')}).eq('id',editing.id);if(error)return alert(error.message);await sb.from('activities').insert({process_id:editing.id,actor_id:me.id,action:'RESPONSABILIDADE DEVOLVIDA',details:{para:userName(to),motivo:reason}});closeModal();await loadAll();renderNav();render()}
function renderNotifications(){$('main').innerHTML=`<div class="row between"><div><h2 style="margin:0">Notificações</h2><div class="muted">Atribuições, correções e prazos.</div></div><button class="btn gray" onclick="markAllRead()">Marcar todas como lidas</button></div><div class="card" style="margin-top:16px">${notifications.map(n=>`<div class="notif ${n.read_at?'':'unread'}"><div class="row between"><div><b>${esc(n.title)}</b><div>${esc(n.body||'')}</div><div class="muted" style="font-size:11px">${new Date(n.created_at).toLocaleString('pt-BR')}</div></div>${!n.read_at?`<button class="btn gray" onclick="readNotif('${n.id}')">Lida</button>`:''}</div></div>`).join('')||'<div class="muted">Nenhuma notificação.</div>'}</div>`}
async function readNotif(id){await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id);await loadAll();renderNav();renderNotifications()}async function markAllRead(){await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',me.id).is('read_at',null);await loadAll();renderNav();renderNotifications()}
async function requestNotifPermission(){if(!('Notification'in window))return alert('Este navegador não oferece notificações.');const p=await Notification.requestPermission();alert(p==='granted'?'Notificações do navegador ativadas.':'Permissão não concedida.')}
function renderSettings(){const cid=localStorage.getItem('drive_client_id')||'',root=localStorage.getItem('drive_root_id')||'';$('main').innerHTML=`<h2>Configurações</h2><div class="card"><h3>Google Drive</h3><p class="muted">Para o site acessar o Drive do escritório, informe um OAuth Client ID do Google Cloud autorizado para este domínio.</p><div class="field"><label>Google OAuth Client ID</label><input id="driveClientId" value="${esc(cid)}"></div><div class="field"><label>ID da pasta raiz do escritório (opcional)</label><input id="driveRootId" value="${esc(root)}"></div><div class="row" style="margin-top:10px"><button class="btn" onclick="saveDriveConfig()">Salvar</button><button class="btn gray" onclick="connectDrive()">Conectar Drive</button></div><div id="driveMsg"></div></div><div class="card" style="margin-top:12px"><h3>Minha conta</h3><p>${esc(me.name)} · ${esc(me.role)}</p><button class="btn red" onclick="logout()">Sair</button></div>`}
function saveDriveConfig(){localStorage.setItem('drive_client_id',$('driveClientId').value.trim());localStorage.setItem('drive_root_id',$('driveRootId').value.trim());msg('driveMsg','Configuração salva.','success')}
let driveToken='';function connectDrive(cb){const clientId=localStorage.getItem('drive_client_id');if(!clientId){if($('driveMsg'))msg('driveMsg','Informe primeiro o OAuth Client ID.','error');else alert('Configure o Google OAuth Client ID em Configurações.');return}const tc=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive',callback:r=>{if(r.error)return alert(r.error);driveToken=r.access_token;if($('driveMsg'))msg('driveMsg','Drive conectado.','success');if(cb)cb()}});tc.requestAccessToken()}
async function driveFetch(url,opt={}){if(!driveToken)return new Promise((resolve,reject)=>connectDrive(()=>driveFetch(url,opt).then(resolve).catch(reject)));const r=await fetch(url,{...opt,headers:{Authorization:`Bearer ${driveToken}`,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.json()}
async function driveSearchAndLink(){if(!editing)return alert('Salve o processo primeiro para vincular o Drive.');try{const root=localStorage.getItem('drive_root_id'),name=editing.client_name.replace(/'/g,"\\'");let q=`mimeType='application/vnd.google-apps.folder' and trashed=false and name contains '${name}'`;if(root)q+=` and '${root}' in parents`;const d=await driveFetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name,webViewLink)&pageSize=20');if(!d.files?.length)return alert('Nenhuma pasta encontrada.');const f=d.files[0];await sb.from('processes').update({drive_folder_id:f.id,drive_folder_name:f.name,drive_folder_url:f.webViewLink||`https://drive.google.com/drive/folders/${f.id}`}).eq('id',editing.id);alert('Pasta vinculada: '+f.name);await loadAll();editing=processes.find(p=>p.id===editing.id);openProcess(editing.id)}catch(e){alert('Drive: '+e.message)}}
async function driveCreateFolder(){if(!editing)return alert('Salve o processo primeiro para criar a pasta.');try{const root=localStorage.getItem('drive_root_id');const body={name:editing.client_name,mimeType:'application/vnd.google-apps.folder'};if(root)body.parents=[root];const f=await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink',{method:'POST',body:JSON.stringify(body)});await sb.from('processes').update({drive_folder_id:f.id,drive_folder_name:f.name,drive_folder_url:`https://drive.google.com/drive/folders/${f.id}`}).eq('id',editing.id);alert('Pasta criada e vinculada.');await loadAll();editing=processes.find(p=>p.id===editing.id);openProcess(editing.id)}catch(e){alert('Drive: '+e.message)}}
sb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
